name: pages

on:
  push:
    branches: [main]
    paths:
      - "public-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the landing page's links resolve inside the repo
        run: python3 -m pytest tests/test_public_site.py -q

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - id: deployment
        uses: actions/deploy-pages@v4

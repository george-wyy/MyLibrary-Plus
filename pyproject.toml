[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mylibrary"
version = "0.1.0"
description = "A minimal, self-contained local research-paper library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
mylibrary = "mylibrary.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mylibrary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
